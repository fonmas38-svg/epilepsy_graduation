# Continuous Integration for the epilepsy monitoring platform.
#
# Why this exists: three students push to one repository. Without CI, a commit
# that breaks the alert pipeline can sit unnoticed until the demo. Every push
# and pull request now proves the backend still works before anyone merges.
#
# Each component is a separate job so a Flutter formatting issue never hides a
# real backend failure, and the report tells you exactly which part broke.
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch: # lets you re-run the checks manually before the defence

# A new push cancels the previous run for the same branch: no wasted minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests (FastAPI)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        # The demo profile is used on purpose: production refuses to start with
        # default secrets, which is exactly the behaviour we want to keep.
        env:
          APP_ENV: demo
          LOG_FORMAT: json
          OUTBOX_WORKER_ENABLED: '0' # tests drive the worker explicitly
        run: python -m pytest tests -q

      - name: Verify the app really starts (migrations + readiness)
        # Tests use an in-memory database. This step catches failures that only
        # appear on a real startup: a broken Alembic migration or a dependency
        # that is unreachable at boot.
        env:
          APP_ENV: demo
          SQLITE_DB_PATH: ./ci-check.db
          OUTBOX_WORKER_ENABLED: '0'
        # Verified locally: prints "STARTUP OK" + "SHUTDOWN OK", non-zero exit
        # if any dependency is unhealthy.
        run: python startup_check.py

  backend-postgres:
    name: Backend tests (PostgreSQL)
    # Deploying on Supabase means running on PostgreSQL, and a green SQLite run
    # proves nothing about it: booleans, ON CONFLICT, sequences and the
    # lower(username) unique index all behave differently. This job runs the
    # exact same suite against a real server so those differences fail here
    # instead of during the migration.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: epilepsy_test
        ports: ['5432:5432']
        # Without the health check the suite can start before the server accepts
        # connections and fail for the wrong reason.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Apply migrations to PostgreSQL
        # Run separately from the tests so a migration that is not
        # PostgreSQL-compatible is reported as a migration failure.
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epilepsy_test
        run: python -m alembic upgrade head

      - name: Run the test suite against PostgreSQL
        # TEST_DATABASE_URL (not DATABASE_URL) is the deliberate opt-in: the
        # fixture TRUNCATEs between tests, so it must never be a real database.
        env:
          APP_ENV: demo
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epilepsy_test
          OUTBOX_WORKER_ENABLED: '0'
        run: python -m pytest tests -q

      - name: Verify startup and readiness on PostgreSQL
        env:
          APP_ENV: demo
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/epilepsy_test
          OUTBOX_WORKER_ENABLED: '0'
        run: python startup_check.py

      - name: Verify the SQLite -> PostgreSQL migration script
        # Proves the ETL path end to end: a fresh SQLite database is created by
        # the app, copied over, and row counts are compared. --truncate is safe
        # here because the target is this job's throwaway service container.
        env:
          APP_ENV: demo
          OUTBOX_WORKER_ENABLED: '0'
        run: |
          SQLITE_DB_PATH=./etl-source.db python startup_check.py
          SQLITE_DB_PATH=./etl-source.db \
          DATABASE_URL=postgresql://postgres:postgres@localhost:5432/epilepsy_test \
            python migrate_sqlite_to_postgres.py --sqlite ./etl-source.db --truncate

  backend-quality:
    name: Backend lint

    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install linter
        run: pip install ruff

      # Style issues must not block a graduation deadline, so this job reports
      # problems without failing the build. Errors that break code (undefined
      # names, unused imports) are still surfaced clearly in the log.
      - name: Lint (advisory)
        continue-on-error: true
        run: ruff check backend --output-format=github

  dashboard:
    name: Admin dashboard build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin-dashboard
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # `npm install` (not `npm ci`) because the repository has no lockfile yet.
      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  mobile:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install packages
        run: flutter pub get

      # Mandatory: the analyzer is clean (0 issues), so any new warning or
      # info is a regression and must be fixed before merging.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test
