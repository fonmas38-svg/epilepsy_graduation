<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IoT Sensor Dashboard</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        .dashboard {
            max-width: 900px;
            margin: auto;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.15);
        }

        .value {
            font-size: 35px;
            font-weight: bold;
            margin: 15px 0;
        }

        .status {
            font-size: 20px;
        }

        @media (max-width: 600px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <h1>IoT Sensor Dashboard</h1>

    <div class="dashboard">

        <div class="card">
            <h2>❤️ Heart Rate</h2>
            <div class="value">
                <span id="heart_rate">--</span> BPM
            </div>
            <div class="status" id="heart_status">
                Waiting...
            </div>
        </div>

        <div class="card">
            <h2>🏃 Motion</h2>
            <div class="value" id="acceleration">--</div>
            <div class="status">Acceleration</div>
        </div>

        <div class="card">
            <h2>⚠️ Fall Detection</h2>
            <div class="value" id="fall">Waiting...</div>
        </div>

        <div class="card">
            <h2>📡 Sensor Status</h2>
            <div class="status" id="connection">Connecting...</div>
        </div>

    </div>

    <script>
        const socket = new WebSocket("ws://" + window.location.host + "/ws");

        socket.onopen = function () {
            document.getElementById("connection").textContent = "Connected";
        };

        socket.onmessage = function (event) {
            const data = JSON.parse(event.data);

            document.getElementById("heart_rate").textContent = data.heart_rate;
            document.getElementById("heart_status").textContent = data.heart_status;
            document.getElementById("acceleration").textContent = data.acceleration;

            if (data.fall) {
                document.getElementById("fall").textContent = "⚠️ FALL DETECTED";
            } else {
                document.getElementById("fall").textContent = "SAFE";
            }
        };

        socket.onerror = function () {
            document.getElementById("connection").textContent = "Connection Error";
        };

        socket.onclose = function () {
            document.getElementById("connection").textContent = "Disconnected";
        };
    </script>

</body>
</html>
