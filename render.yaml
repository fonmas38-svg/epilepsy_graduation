# Render Blueprint configuration for Epilepsy Graduation Project Backend
# Connects FastAPI service with Cloud Preictal AI Model and Supabase PostgreSQL.

services:
  - type: web
    name: epilepsy-backend
    runtime: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips '*'
    envVars:
      - key: APP_ENV
        value: production
      # Must point to Supabase Transaction Pooler (port 6543) with ?sslmode=require
      - key: DATABASE_URL
        sync: false
      # Optional direct connection (port 5432) for Alembic DDL migrations
      - key: ALEMBIC_DATABASE_URL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: "60"
      - key: SESSION_LIFETIME_SECONDS
        # 30 days, renewed while the app is in use (sliding expiry).
        value: "2592000"
      - key: RUN_MIGRATIONS_ON_STARTUP
        value: "0"
      - key: NOTIFICATION_CHANNEL
        value: fcm
      - key: USE_DEEP_MODEL
        value: "1"
      - key: USE_PREICTAL_MODEL
        value: "1"
      # Explicit frontend/admin origin(s); wildcard '*' is forbidden in production
      - key: CORS_ORIGINS
        sync: false
